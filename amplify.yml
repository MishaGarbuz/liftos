version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "LiftOS static deploy — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        - test -f index.html
        - test -f config.json
        - test -f manifest.json
        - test -f css/app.css
        - test -d js/pages
    build:
      commands:
        - echo "No build step (single-page app)"
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  cache:
    paths: []
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: Strict-Transport-Security
          value: max-age=63072000; includeSubDomains; preload
        - key: X-Content-Type-Options
          value: nosniff
        - key: Referrer-Policy
          value: strict-origin-when-cross-origin
        - key: X-Frame-Options
          value: DENY
        - key: Permissions-Policy
          value: camera=(), microphone=(), geolocation=()
        - key: Content-Security-Policy
          value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.amazonaws.com https://*.amazoncognito.com; manifest-src 'self'; worker-src 'self'"
    - pattern: 'config.json'
      headers:
        - key: Cache-Control
          value: no-cache, no-store, must-revalidate
    - pattern: 'index.html'
      headers:
        - key: Cache-Control
          value: no-cache, no-store, must-revalidate
    - pattern: 'sw.js'
      headers:
        - key: Cache-Control
          value: no-cache, no-store, must-revalidate
customRedirects:
  - source: '/<*>'
    target: '/index.html'
    status: '404-200'
