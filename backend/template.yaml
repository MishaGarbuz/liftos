AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lifting Tracker - DynamoDB + API Gateway + Lambda + Cognito

Parameters:
  AllowedOrigins:
    Type: String
    Default: 'https://www.liftos.net,https://liftos.net,http://localhost:5500,http://127.0.0.1:5500'
  AlertEmail:
    Type: String
    Description: Email for CloudWatch alarm notifications (optional)
    Default: ''

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref LiftingTrackerTable
        LEGACY_USER_PK: USER#michael
        LEGACY_PROGRESS_PK: PROGRESS#michael
        ALLOWED_ORIGINS: !Ref AllowedOrigins

Resources:

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: liftos-users
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: liftos-web
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  LiftingTrackerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LiftingTracker
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: sk-pk-index
          KeySchema:
            - AttributeName: sk
              KeyType: HASH
            - AttributeName: pk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: App
          Value: LiftingTracker

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                Resource:
                  - !GetAtt LiftingTrackerTable.Arn
                  - !Sub '${LiftingTrackerTable.Arn}/index/*'

  LiftingTrackerApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Description: Lifting Tracker REST API (Cognito protected)
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'https://www.liftos.net,https://liftos.net'"

  SessionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LiftingTracker-Sessions
      CodeUri: functions/
      Handler: sessions/handler.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        GetSessions:
          Type: Api
          Properties:
            RestApiId: !Ref LiftingTrackerApi
            Path: /sessions
            Method: GET
        PostSession:
          Type: Api
          Properties:
            RestApiId: !Ref LiftingTrackerApi
            Path: /sessions
            Method: POST
        GetSession:
          Type: Api
          Properties:
            RestApiId: !Ref LiftingTrackerApi
            Path: /sessions/{sessionId}
            Method: GET
        DeleteSession:
          Type: Api
          Properties:
            RestApiId: !Ref LiftingTrackerApi
            Path: /sessions/{sessionId}
            Method: DELETE
        OptionsSessions:
          Type: Api
          Properties:
            RestApiId: !Ref LiftingTrackerApi
            Path: /sessions
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        OptionsSessionId:
          Type: Api
          Properties:
            RestApiId: !Ref LiftingTrackerApi
            Path: /sessions/{sessionId}
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  SetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LiftingTracker-Sets
      CodeUri: functions/
      Handler: sets/handler.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        PostSet:
          Type: Api
          Properties:
            RestApiId: !Ref LiftingTrackerApi
            Path: /sessions/{sessionId}/sets
            Method: POST
        GetSets:
          Type: Api
          Properties:
            RestApiId: !Ref LiftingTrackerApi
            Path: /sessions/{sessionId}/sets
            Method: GET
        OptionsSets:
          Type: Api
          Properties:
            RestApiId: !Ref LiftingTrackerApi
            Path: /sessions/{sessionId}/sets
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  ProgressFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LiftingTracker-Progress
      CodeUri: functions/
      Handler: progress/handler.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        GetProgress:
          Type: Api
          Properties:
            RestApiId: !Ref LiftingTrackerApi
            Path: /progress/{exercise}
            Method: GET
        GetAllProgress:
          Type: Api
          Properties:
            RestApiId: !Ref LiftingTrackerApi
            Path: /progress
            Method: GET
        OptionsProgress:
          Type: Api
          Properties:
            RestApiId: !Ref LiftingTrackerApi
            Path: /progress
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        OptionsProgressExercise:
          Type: Api
          Properties:
            RestApiId: !Ref LiftingTrackerApi
            Path: /progress/{exercise}
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  SummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LiftingTracker-Summary
      CodeUri: functions/
      Handler: summary/handler.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        GetSummary:
          Type: Api
          Properties:
            RestApiId: !Ref LiftingTrackerApi
            Path: /summary
            Method: GET
        OptionsSummary:
          Type: Api
          Properties:
            RestApiId: !Ref LiftingTrackerApi
            Path: /summary
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: liftos-alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  SessionsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmName: LiftOS-Sessions-Lambda-Errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: LiftingTracker-Sessions
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  DynamoThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmName: LiftOS-DynamoDB-Throttles
      AlarmDescription: DynamoDB throttled requests
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref LiftingTrackerTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${LiftingTrackerApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: LiftingTrackerApiUrl
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  CognitoClientId:
    Description: Cognito App Client ID
    Value: !Ref CognitoUserPoolClient
  CognitoRegion:
    Description: AWS Region for Cognito
    Value: !Ref AWS::Region
  TableName:
    Description: DynamoDB Table Name
    Value: !Ref LiftingTrackerTable
